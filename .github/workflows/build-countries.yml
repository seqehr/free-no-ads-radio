name: Build country pages

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
      - .github/workflows/build-countries.yml

permissions:
  contents: write

concurrency:
  group: build-countries
  cancel-in-progress: true   # a newer push makes an older run pointless

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate country pages
        run: node scripts/build-countries.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A radio sitemap.xml index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update country pages ($(date -u +%F))"
          # Someone may have pushed while we were building: rebase and retry instead of failing
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --rebase origin main; }
          done
          exit 1
